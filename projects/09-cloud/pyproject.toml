[project]
name = "cloudpipe"
version = "0.1.0"
description = "Projeto 09 — pipeline em nuvem (S3 → SQS → Lambda) com Terraform, IAM de menor privilégio e policy-as-code"
requires-python = ">=3.11"
dependencies = ["boto3>=1.35"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 130
target-version = ["py311"]
