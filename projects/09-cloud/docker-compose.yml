# Emulador AWS (Moto: S3, SQS, IAM, KMS, Lambda*, Logs, CloudWatch, STS) + Terraform em contêiner.
#   *Moto cria a função Lambda, mas só a EXECUTA com acesso ao Docker — por isso o e2e usa um "poller" local.
# Porta configurável: MOTO_PORT.
services:
  moto:
    image: motoserver/moto:latest
    ports:
      - "127.0.0.1:${MOTO_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:5000/moto-api/')\""]
      interval: 3s
      retries: 20

  terraform:
    image: hashicorp/terraform:1.10
    profiles: ["tools"]
    depends_on:
      moto: {condition: service_healthy}
    environment:
      TF_IN_AUTOMATION: "1"
      TF_VAR_emulator_endpoint: "http://moto:5000"
      TF_VAR_enable_event_source_mapping: "false"
      TF_VAR_lambda_src_dir: /app/src/cloudpipe
      TF_PLUGIN_CACHE_DIR: /tfwork/.plugin-cache
    entrypoint: ["/bin/sh", "-c"]
    working_dir: /tfwork
    volumes:
      - ./infra:/infra:ro
      - ./src:/app/src:ro
      - tfwork:/tfwork

volumes:
  tfwork:
