[project]
name = "streamlab"
version = "0.1.0"
description = "Projeto 08 — Kafka → Spark Structured Streaming (event time, watermark, dedup, checkpoint) → PostgreSQL"
requires-python = ">=3.10"
dependencies = ["pyspark>=4.0,<5", "confluent-kafka>=2.5,<3", "psycopg[binary]>=3.1,<4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: precisa de Kafka, PostgreSQL e Spark (docker compose)"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py310"]
