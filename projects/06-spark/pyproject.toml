[project]
name = "sparkjobs"
version = "0.1.0"
description = "Projeto 06 — processamento distribuído com Spark: pipeline, skew, shuffle e tuning medidos"
requires-python = ">=3.10"
dependencies = ["pyspark>=4.0,<5"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 110
target-version = ["py310"]
