# `spark`   : contêiner de trabalho (modo local[*] ou cliente do cluster).
# cluster   : `docker compose --profile cluster up -d --scale worker=2` (master + 2 workers).
# O código é montado em /app (somente leitura) em TODOS os contêineres — executores precisam
# importar `sparkjobs` — e os dados ficam no volume `data`, também compartilhado.
x-spark: &spark
  image: sparkjobs:local
  build: .
  volumes:
    - ./:/app:ro
    - data:/data

services:
  spark:
    <<: *spark
    entrypoint: ["/bin/bash", "-c"]
    command: ["echo 'use: docker compose run --rm spark \"spark-submit ...\"'"]

  master:
    <<: *spark
    profiles: ["cluster"]
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    command: ["--host", "master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "127.0.0.1:${SPARK_MASTER_UI_PORT:-8080}:8080"

  worker:
    <<: *spark
    profiles: ["cluster"]
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker"]
    command: ["spark://master:7077", "--cores", "2", "--memory", "3g"]
    depends_on: [master]

volumes:
  data:
