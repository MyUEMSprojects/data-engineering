services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: de
      POSTGRES_PASSWORD: de
      POSTGRES_DB: warehouse
    ports: ["${POSTGRES_PORT:-5432}:5432"]   # mude via POSTGRES_PORT se a 5432 estiver ocupada
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
