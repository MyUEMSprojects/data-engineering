version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values: {arguments: {values: [created, paid, shipped, canceled]}}
  - name: stg_order_items
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments: {column_names: [order_id, line_no]}
