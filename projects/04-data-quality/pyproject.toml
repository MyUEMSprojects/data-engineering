[project]
name = "dqpipe"
version = "0.1.0"
description = "Projeto 04 — pipeline com contrato de dados, checks, quarentena, gate e observabilidade"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1,<2", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]
ignore = ["E501"]  # o black cuida do código; strings/docstrings longas são aceitas

[tool.black]
line-length = 100
