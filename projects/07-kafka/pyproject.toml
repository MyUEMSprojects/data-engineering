[project]
name = "kpipe"
version = "0.1.0"
description = "Projeto 07 — producer → Kafka → consumer → PostgreSQL (at-least-once + sink idempotente, DLQ, lag)"
requires-python = ">=3.11"
dependencies = ["confluent-kafka>=2.5,<3", "psycopg[binary]>=3.1,<4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: precisa do Kafka e do PostgreSQL do docker-compose (KAFKA_BOOTSTRAP, PG_DSN)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
