[project]
name = "basic-etl"
version = "0.1.0"
description = "Projeto 01 — ETL básico: CSV/API -> Python -> PostgreSQL"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4", "requests>=2.32,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: precisa de um PostgreSQL (TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
