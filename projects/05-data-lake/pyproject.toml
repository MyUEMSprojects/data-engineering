[project]
name = "lake"
version = "0.1.0"
description = "Projeto 05 — data lake com object storage (MinIO/S3), Parquet, particionamento e arquitetura medallion"
requires-python = ">=3.11"
dependencies = ["pyarrow>=17,<26", "duckdb>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: precisa do MinIO rodando (LAKE_URI=s3://...)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DTZ"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
