name: CI

on:
  push:
    branches: [main, build/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

  link-check:
    name: Internal link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative links
        # Falha se algum link relativo em Markdown apontar para arquivo inexistente.
        run: |
          python3 .github/scripts/check_links.py

  python:
    name: Python lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest
      - name: Ruff
        run: ruff check . || true   # projetos são opcionais; não bloqueia o currículo
      - name: Black (check)
        run: black --check . || true
      - name: Pytest
        run: |
          if find . -name "test_*.py" -not -path "*/node_modules/*" | grep -q .; then
            pytest -q || true
          else
            echo "Nenhum teste encontrado ainda."
          fi
