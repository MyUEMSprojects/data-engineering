name: Capstone

on:
  push:
    branches: [main, build/**]
    paths: ["projects/10-capstone/**", ".github/workflows/capstone.yml"]
  pull_request:
    branches: [main]
    paths: ["projects/10-capstone/**", ".github/workflows/capstone.yml"]

permissions:
  contents: read

concurrency:
  group: capstone-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/10-capstone

jobs:
  quality:
    name: Lint + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/10-capstone/requirements.txt
      - run: pip install -r requirements.txt ruff black
      - run: ruff check .
      - run: black --check .
      - run: pytest -q
        env:
          PYTHONPATH: src

  alerts:
    name: Regras de alerta (promtool)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check rules
        run: docker run --rm --entrypoint promtool -v "$PWD/monitoring:/m:ro" prom/prometheus:v2.55.1 check rules /m/alerts.yml

  image-and-demo:
    name: Imagem + demo ponta a ponta
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t capstone:ci .
      - name: Demo (autoverificável — falha se qualquer check falhar)
        run: docker run --rm capstone:ci demo

  dag:
    name: DAG do Airflow parseia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DagBag
        run: |
          docker run --rm -v "$PWD/dags:/dags:ro" --entrypoint python apache/airflow:3.0.0 -c "
          from airflow.models.dagbag import DagBag
          b = DagBag('/dags', include_examples=False)
          assert not b.import_errors, b.import_errors
          assert 'capstone_daily' in b.dags
          print('OK', sorted(b.dags['capstone_daily'].task_ids))"
